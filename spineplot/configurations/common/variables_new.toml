binning_scheme = 'equal_width'
xlabel = 'Reconstructed $\delta p_T$ [GeV/c]'


[variables.reco_dalphaT]
key = 'reco_dalphaT'
range = [0.0, 3.2]
nbins = 10
binning_scheme = 'equal_width'
xlabel = 'Reconstructed $d\alpha_T$ [rad]'

[variables.reco_leading_electron_dpT]
