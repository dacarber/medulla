nbins =	20
xlabel = "Reconstructed Electron NuMI Angle [Radian]"

[variables.reco_proton_NuMI_angle]
key = 'reco_proton_NuMI_angle'
range = [0.0,3.2]
nbins =	20
xlabel = "Reconstructed Proton NuMI Angle [Radian]"

[variables.reco_electron_dedx]
