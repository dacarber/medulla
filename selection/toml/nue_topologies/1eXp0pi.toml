[general]
output = "1eXp0pi"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
    "@null_threshold"
]

[parameters]
photon_threshold = 0.025
electron_threshold = 0.025
muon_threshold = 0.025
pion_threshold = 0.025
proton_threshold = 0.025
null_threshold = 0.0


[[category]] # 0 : Signal, 1eXp0pi (X protons >= 0, 0 pions incl. pi0)
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut" },
    { name = "single_electron", parameters = [ "@electron_threshold" ] },
    { name = "no_muons", parameters = [ "@muon_threshold" ] },
    { name = "!at_least_one_pion", parameters = [ "@pion_threshold", "@photon_threshold" ] },
]
[[category]] # 1 : Signal, 1eXpNpi (X protons >= 0, N pions >= 1 incl. pi0)
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut" },
    { name = "single_electron", parameters = [ "@electron_threshold" ] },
    { name = "no_muons", parameters = [ "@muon_threshold" ] },
    { name = "at_least_one_pion", parameters = [ "@pion_threshold", "@photon_threshold" ] },
]
[[category]] # 2 : Neutrino, Out of Fiducial Volume (OOFV) - signal topology, out of fiducial
cuts = [
    { name = "neutrino" },
    { name = "!fiducial_cut" },
    { name = "single_electron", parameters = [ "@electron_threshold" ] },
    { name = "no_muons", parameters = [ "@muon_threshold" ] },
]
[[category]] # 3 : Neutrino, Out of Phase Space (OOPS) - signal topology, lepton below threshold
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut" },
    { name = "single_electron", parameters = [ "@null_threshold" ] },
    { name = "no_muons", parameters = [ "@muon_threshold" ] },
]
[[category]] # 4 : Neutrino, Other CC Nue
cuts = [
    { name = "neutrino" },
    { name = "iscc" },
    { name = "single_electron", parameters = [ "@electron_threshold" ] },
]
[[category]] # 5 : Neutrino, Other CC Numu
cuts = [
    { name = "neutrino" },
    { name = "iscc" },
    { name = "single_muon", parameters = [ "@muon_threshold" ] },
]
[[category]] # 6 : Neutrino, Other NC nu
cuts = [
    { name = "neutrino" },
    { name = "!iscc" },
]
[[category]] # 7 : Cosmic
cuts = [
    { name = "!neutrino" },
]

[[sample]]
name = "cvext"
path = "/pnfs/icarus/persistent/users/dcarber/spine/NuMI_CV_ext/v09_89_01_02p02_redo/*.root"
ismc = true
disable = false

