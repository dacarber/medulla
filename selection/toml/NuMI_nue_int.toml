[general]
output = "example"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold = 0.025
electron_threshold = 0.07
muon_threshold = 0.025
pion_threshold = 0.025
proton_threshold = 0.04
null_threshold = 0.0

[[category]] # 0 : Neutrino, charged current 1e1p
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"},
    #{ name = "track_containment_cut"},
    { name = "no_photons", parameters = [ "@photon_threshold"   ]},
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ]},
    { name = "no_muons", parameters = [ "@muon_threshold"   ]},
    { name = "!no_protons", parameters = [ "@proton_threshold"   ]},
]
[[category]] # 1 : Neutrino, Uncontained and Out of Fiducial Volume (OOFV)
cuts = [
    { name = "neutrino" },
    { name = "no_photons", parameters = [ "@photon_threshold"   ]},
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ]},
    { name = "no_muons", parameters = [ "@muon_threshold"   ]},
    { name = "multiproton", parameters = [ "@proton_threshold"   ]},
]
[[category]] # 2 : Neutrino, Out of phase space (OOPS)
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"},
    #{ name = "track_containment_cut"},
    { name = "no_photons", parameters = [ "@photon_threshold"   ]},
    { name = "single_electron", parameters = [ "@null_threshold"   ]},
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ]},
    { name = "no_muons", parameters = [ "@muon_threshold"   ]},
    { name = "!no_protons", parameters = [ "@null_threshold"   ]},
]

[[category]] # 3 : Neutrino, Other CC Nue, Mpi (M >0)
cuts = [
    { name = "neutrino" },
    { name = "iscc"    },
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
    { name = "!no_charged_pions", parameters = [ "@pion_threshold"   ]},
]
[[category]] # 4 : Neutrino, Other CC Nue, pi0
cuts = [
    { name = "neutrino" },
    { name = "at_least_one_pi0", parameters = ["@photon_threshold"]}
]
[[category]] # 5 : Neutrino, Other CC Nue
cuts = [
    { name = "neutrino" },
    { name = "iscc"    },
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
]

[[category]] # 6 : Neutrino, Other CC Numu
cuts = [
    { name = "neutrino" },
    { name = "iscc"    },
    { name = "single_muon", parameters = [ "@muon_threshold"   ]},
]

[[category]] # 7 : Neutrino, neutral current
cuts = [
    { name = "neutrino" },
    { name = "!iscc"    },
]

[[category]] # 8 : Cosmic
cuts = [
    { name = "!neutrino" },
]
[[category]] # 8 : Neutrino, Other
cuts = [
    { name = "neutrino" },
]


