range = [0,10]
nbins =	25
xlabel = "Reconstructed Electron Starting dE/dX [MeV/cm]"

[variables.reco_NuMI_polar]
key = 'reco_NuMI_polar'
range = [0.0,3.2]
nbins =	100
xlabel = "Reconstructed Polar Angle w.r.t. NuMI"
[variables.reco_NuMI_azi]
key = 'reco_NuMI_azi'
range = [0.0,3.2]
nbins =	100
xlabel = "Reconstructed Azimuthal Angle w.r.t. NuMI"

