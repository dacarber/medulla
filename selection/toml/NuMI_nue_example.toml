[general]
output = "example_lite"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold = 25.0
electron_threshold = 70.0
muon_threshold = 25
pion_threshold = 25.0
proton_threshold = 40.0
null_threshold = 0.0

[[category]] # 0 : Neutrino, charged current 1e1p
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"},
    #{ name = "track_containment_cut"},
    { name = "no_photons", parameters = [ "@photon_threshold"   ]},
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ]},
    { name = "no_muons", parameters = [ "@muon_threshold"   ]},
    { name = "!no_protons", parameters = [ "@proton_threshold"   ]},
]
[[category]] # 1 : Neutrino, Uncontained and Out of Fiducial Volume (OOFV)
cuts = [
    { name = "neutrino" },
    { name = "no_photons", parameters = [ "@photon_threshold"   ]},
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ]},
    { name = "no_muons", parameters = [ "@muon_threshold"   ]},
    { name = "!no_protons", parameters = [ "@proton_threshold"   ]},
]
[[category]] # 2 : Neutrino, Out of phase space (OOPS)
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"},
    { name = "track_containment_cut"},
    { name = "no_photons", parameters = [ "@photon_threshold"   ]},
    { name = "single_electron", parameters = [ "@null_threshold"   ]},
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ]},
    { name = "no_muons", parameters = [ "@muon_threshold"   ]},
    { name = "!no_protons", parameters = [ "@null_threshold"   ]},
]
[[category]] # 3 : Neutrino, Other CC Nue
cuts = [
    { name = "neutrino" },
    { name = "iscc"    },
    { name = "single_electron", parameters = [ "@electron_threshold"   ]},
]

[[category]] # 4 : Neutrino, Other CC Numu
cuts = [
    { name = "neutrino" },
    { name = "iscc"    },
    { name = "single_muon", parameters = [ "@muon_threshold"   ]},
]

[[category]] # 5 : Neutrino, neutral current
cuts = [
    { name = "neutrino" },
    { name = "!iscc"    },
]

[[category]] # 6 : Cosmic
cuts = [
    { name = "!neutrino" },
]
[[category]] # 7 : Neutrino, Other
cuts = [
    { name = "neutrino" },
]

[[sample]]
name = "simulation"
path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/*.root" #Paths need to point to a merged flattened caf files
#path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_Nue_det_sys_flat_cafs/NuMI_nue_det_CV.root"
ismc = true
#ICARUS BNB:
#ICARUS NuMI:
[[sample]]
name = "simulation_nue"
path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_Nue_det_sys_flat_cafs/NuMI_nue_det_CV.root"
ismc = true

[[tree]]
name = "selected"
sim_only = false
mode = "reco"
cut = [
    { name = "fiducial_cut",     type = "reco" },
    { name = "track_containment_cut",  type = "reco" }, 
    { name = "flash_cut", type = "reco", parameters = [0,9.6]},
    { name = "no_photons",       type = "reco", parameters = [ "@photon_threshold"   ] },
    { name = "single_electron",     type = "reco", parameters = [ "@electron_threshold" ] },
    { name = "no_charged_pions", type = "reco", parameters = [ "@pion_threshold"     ] },
    { name = "no_muons",      type = "reco", parameters = [ "@muon_threshold"     ] },
    { name = "!no_protons",    type = "reco", parameters = [ "@proton_threshold"   ] }, #This allows to grab events N > 0 protons
]
branch = [
    {name = "neutrino_id",            type = "true"},
    {name = "cc",                    type = "mctruth"},
    {name = "pdg",                   type = "mctruth"}, #Needed for NuMI Flux calculation
    {name = "parent_pdg",            type = "mctruth"}, #Needed for NuMI Flux calculation
    {name = "interaction_type",      type = "mctruth"},
     {name = "energy_init",      type = "true"},
    {name = "neutrino_energy",       type = "mctruth"}, #Needed for NuMI Flux calculation
    {name = "category",              type = "true"},
    {name = "visible_energy",        type = "both"},
    {name = "fiducial",              type = "reco"},
    {name = "containment",           type = "reco"},
    {name = "flash_time",            type = "reco"},
    { name = "fiducial_cut",     type = "both" },
    { name = "track_containment_cut",  type = "both" },
    { name = "no_photons",       type = "both", parameters = [ "@photon_threshold"   ] },
    { name = "single_electron",     type = "both", parameters = [ "@electron_threshold" ] },
    { name = "no_charged_pions", type = "both", parameters = [ "@pion_threshold"     ] },
    { name = "no_muons",      type = "both", parameters = [ "@muon_threshold"     ] },
    {name = "dpT", type = "both"},
    {name = "dpT_lp", type = "both"},
    {name = "dphiT", type = "both"},
    {name = "dalphaT", type = "both"},
    {name = "opening_angle", type = "both"},
    {name = "flash_time", type = "reco"},
    {name = "vertex_x", type = "both"},
    {name = "vertex_y", type = "both"},
    {name = "vertex_z", type = "both"},
    # Leading ELECTRON interaction-level
    { name = "end_x",                 type = "both_particle", selector = "leading_electron"   },
    { name = "end_y",                 type = "both_particle", selector = "leading_electron"   },
    { name = "end_z",                 type = "both_particle", selector = "leading_electron"   },
    { name = "dpT",                   type = "both_particle", selector = "leading_electron"   },
    { name = "polar_angle",           type = "both_particle", selector = "leading_electron"   },
    { name = "azimuthal_angle",       type = "both_particle", selector = "leading_electron"   },
    { name = "primary_softmax",       type = "reco_particle", selector = "leading_electron"   },
    { name = "secondary_softmax",     type = "reco_particle", selector = "leading_electron"   },
    { name = "electron_softmax",      type = "reco_particle", selector = "leading_electron"   },
    { name = "photon_softmax",        type = "reco_particle", selector = "leading_electron"   },
    { name = "mip_softmax",           type = "reco_particle", selector = "leading_electron"   },
    { name = "hadron_softmax",        type = "reco_particle", selector = "leading_electron"   },

    {name = "photon_multiplicity",   type = "both", parameters = [ "@photon_threshold"   ]},
    {name = "electron_multiplicity", type = "both", parameters = [ "@electron_threshold" ]},
    {name = "muon_multiplicity",     type = "both", parameters = [ "@muon_threshold"     ]},
    {name = "pion_multiplicity",     type = "both", parameters = [ "@pion_threshold"     ]},
    {name = "proton_multiplicity",   type = "both", parameters = [ "@proton_threshold"   ]},
    {name = "ke",                    type = "both_particle", selector = "leading_electron"   },
    {name = "start_dedx",            type = "reco_particle", selector = "leading_electron"   },
    {name = "start_straightness",    type = "reco_particle", selector = "leading_electron"   },
    {name = "axial_spread",          type = "reco_particle", selector = "leading_electron"   },
    {name = "directional_spread",    type = "reco_particle", selector = "leading_electron"   },
    {name = "vertex_distance",       type = "reco_particle", selector = "leading_electron"   },
    {name = "muon_softmax",          type = "reco_particle", selector = "leading_proton" },
    {name = "pion_softmax",          type = "reco_particle", selector = "leading_proton" },
    {name = "proton_softmax",        type = "reco_particle", selector = "leading_proton" },
    { name = "length",            type = "both_particle", selector = "leading_proton" },
    { name = "dpT",               type = "both_particle", selector = "leading_proton" },
    { name = "polar_angle",       type = "both_particle", selector = "leading_proton" },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_proton" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_proton" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_proton" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "mip_softmax",       type = "reco_particle", selector = "leading_proton" },
    { name = "hadron_softmax",    type = "reco_particle", selector = "leading_proton" },
    {name = "ke",                    type = "both_particle", selector = "leading_proton"   },
    {name = "ke_bias",                    type = "true_particle", selector = "leading_electron"   },
    {name = "electron_softmax",          type = "reco_particle", selector = "leading_electron" },
    {name = "primary_softmax",          type = "reco_particle", selector = "leading_electron" },
]


