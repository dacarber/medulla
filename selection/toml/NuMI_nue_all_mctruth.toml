[general]
output = "all_datasets"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
    "@null_threshold"
]

[parameters]
photon_threshold = 0.025
electron_threshold = 0.15
muon_threshold = 0.025
pion_threshold = 0.025
proton_threshold = 0.04
null_threshold = 0.0
proton_upper_threshold = 0.6
[[category]] # 0 : Neutrino, CC 1eNp0pi
cuts = [
    { name = "neutrino" , type = "mctruth"},
    { name = "fiducial_cut", type = "mctruth"},
    #{ name = "track_containment_cut"},
    #{ name = "no_photons", parameters = [ "@photon_threshold"   ], type = "mctruth"},
    { name = "single_electron", parameters = [ "@electron_threshold"   ], type = "mctruth"},
    #{ name = "no_charged_pions", parameters = [ "@pion_threshold"   ], type = "mctruth"},
    { name = "no_muons", parameters = [ "@muon_threshold"   ], type = "mctruth"},
    { name = "!no_protons", parameters = [ "@proton_threshold" ], type = "mctruth"},
    { name = "vertex_z_veto_cut", type = "mctruth", parameters = [-100.0, 100.0]},
    { name = "no_extra_particles_minerva", type = "mctruth"},
    { name = "leading_proton_ke_cut", parameters = [ "@proton_threshold" ,"@proton_upper_threshold"  ], type = "mctruth",selector="leading_proton"},
    #{ name = "no_neutral_pions", type = "mctruth"}
]
[[category]] # 1 : Neutrino, Uncontained and Out of Fiducial Volume (OOFV)
cuts = [
    { name = "neutrino" , type = "mctruth"},
    { name = "no_photons", parameters = [ "@photon_threshold"   ], type = "mctruth"},
    { name = "single_electron", parameters = [ "@electron_threshold"   ], type = "mctruth"},
    { name = "no_charged_pions", parameters = [ "@pion_threshold"   ], type = "mctruth"},
    { name = "no_muons", parameters = [ "@muon_threshold"   ], type = "mctruth"},
    { name = "!no_protons", parameters = [ "@proton_threshold" ], type = "mctruth"},
    { name = "no_extra_particles_minerva", type = "mctruth"},
    { name = "leading_proton_ke_cut", parameters = [ "@proton_threshold" ,"@proton_upper_threshold"  ], type = "mctruth",selector="leading_proton"},
    { name = "no_neutral_pions", type = "mctruth"}
]
[[category]] # 2 : Neutrino, Out of phase space (OOPS)
cuts = [
    { name = "neutrino" , type = "mctruth"},
    { name = "fiducial_cut", type = "mctruth"},
    #{ name = "track_containment_cut"},
    #{ name = "no_photons", parameters = [ "@photon_threshold"   ], type = "mctruth"},
    { name = "single_electron", parameters = [ "@null_threshold"   ], type = "mctruth"},
    #{ name = "no_charged_pions", parameters = [ "@pion_threshold"   ], type = "mctruth"},
    { name = "no_muons", parameters = [ "@muon_threshold"   ], type = "mctruth"},
    { name = "no_protons", parameters = [ "@proton_threshold" ], type = "mctruth"},
    { name = "vertex_z_veto_cut", type = "mctruth", parameters = [-100.0, 100.0]},
    { name = "no_extra_particles_minerva", type = "mctruth" },
    { name = "!leading_proton_ke_cut", parameters = [ "@proton_threshold" ,"@proton_upper_threshold"  ], type = "mctruth",selector="leading_proton"},
    #{ name = "no_neutral_pions", type = "mctruth"}

]

[[category]] # 3 : Neutrino, Other CC Nue, Mpi (M >0)
cuts = [
    { name = "neutrino" , type = "mctruth"},
    { name = "iscc"    , type = "mctruth"},
    { name = "single_electron", parameters = [ "@electron_threshold"   ], type = "mctruth"},
    { name = "!no_charged_pions", parameters = [ "@pion_threshold"   ], type = "mctruth"},
]
[[category]] # 4 : Neutrino, Other CC Nue, pi0
cuts = [
    { name = "neutrino" , type = "mctruth"},
    #{ name = "at_least_one_pi0", parameters = ["@photon_threshold"], type = "mctruth"}
    { name = "!no_neutral_pions", type = "mctruth"}
]
[[category]] # 5 : Neutrino, Other CC Nue
cuts = [
    { name = "neutrino" , type = "mctruth"},
    { name = "iscc"    , type = "mctruth"},
    { name = "single_electron", parameters = [ "@electron_threshold"   ], type = "mctruth"},
]

[[category]] # 6 : Neutrino, Other CC Numu
cuts = [
    { name = "neutrino" , type = "mctruth"},
    { name = "iscc"    , type = "mctruth"},
    { name = "single_muon", parameters = [ "@muon_threshold"   ], type = "mctruth"},
]

[[category]] # 7 : Neutrino, neutral current
cuts = [
    { name = "neutrino" , type = "mctruth"},
    { name = "!iscc"    , type = "mctruth"},
]

[[category]] # 8 : Cosmic
cuts = [
    { name = "!neutrino" , type = "mctruth"},
]
[[category]] # 9 : Neutrino, Other
cuts = [
    { name = "neutrino" , type = "mctruth"},
]

