[variables.reco_vertex_x]
key = "reco_vertex_x"
range = [-400, 400]
nbins = 20
xlabel = 'Reconstructed Vertex Position X [cm]'

[variables.reco_vertex_y]
key = "reco_vertex_y"
range = [-200, 200]
