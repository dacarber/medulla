xlabel = "Reconstructed \u03B4$\u03B1_{T}$ [Radian]"

[variables.reco_dphiT]
key = 'reco_dphiT'
range = [0.0,3.2]
nbins =	20
xlabel = "Reconstructed \u03B4$\u03A6_{T}$ [Radian]"

[variables.reco_opening_angle]
key = 'reco_opening_angle'
range = [0.0,3.2]
nbins =	20
xlabel = "Reconstructed Opening Angle [Radian]"

[variables.reco_electron_NuMI_angle]
key = 'reco_electron_NuMI_angle'
